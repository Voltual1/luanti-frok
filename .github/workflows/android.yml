name: android

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 10

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gettext ccache

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: luanti-android-arm64-debug-${{ runner.os }}
        max-size: 1G
        verbose: 1

    - name: Cache Android native deps
      uses: actions/cache@v4
      with:
        path: android/native/deps
        key: luanti-android-deps-arm64-${{ hashFiles('android/native/build.gradle') }}
        restore-keys: |
          luanti-android-deps-arm64-

    - name: Build Debug APK (arm64 only)
      run: cd android; ./gradlew assembleRelease --build-cache

    - name: Save arm64 APKs
      uses: actions/upload-artifact@v7
      with:
        name: Luanti-arm64-v8a-apks
        path: |
         android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
         android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
        if-no-files-found: error
