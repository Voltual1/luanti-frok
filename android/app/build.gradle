apply plugin: 'com.android.application'

android {
	ndkVersion "$ndk_version"
	defaultConfig {
		applicationId 'me.voltual.nb'
		minSdkVersion 21
		compileSdk = 34
		targetSdkVersion 35
		versionName "${versionMajor}.${versionMinor}.${versionPatch}"
		versionCode versionMajor * 1000000 + versionMinor * 10000 + versionPatch * 100 + versionBuild
	}

	buildFeatures {
		buildConfig true
	}

	// load properties
	Properties props = new Properties()
	def propfile = file('../local.properties')
	if (propfile.exists()) {
		props.load(new FileInputStream(propfile))
	}
	def keystorePropsFile = rootProject.file('keystore.properties')
	if (keystorePropsFile.exists()) {
		props.load(new FileInputStream(keystorePropsFile))
	}

	signingConfigs {
		release {
			def ksPath = System.getenv('KEYSTORE_PATH') ?: props.getProperty('storeFile') ?: props.getProperty('keystore') ?: 'tag_keystore.p12'
			storeFile file(ksPath)
			storePassword System.getenv('KEYSTORE_PASSWORD') ?: props.getProperty('storePassword') ?: props.getProperty('keystore.password')
			keyAlias System.getenv('KEY_ALIAS') ?: props.getProperty('keyAlias') ?: props.getProperty('key')
			keyPassword System.getenv('KEY_PASSWORD') ?: props.getProperty('keyPassword') ?: props.getProperty('key.password')
		}
	}

	buildTypes {
		release {
			minifyEnabled true
			signingConfig signingConfigs.release
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}

	// for multiple APKs
	splits {
		abi {
			enable true
			reset()
			include 'arm64-v8a'
		}
	}

	packagingOptions {
		resources {
			excludes += [
					'/META-INF/DEPENDENCIES'
			]
		}
	}

	namespace 'net.minetest.minetest'
}

// Register one task for each locale file
def localeFolder = layout.buildDirectory.dir("locale").get().asFile
def projRoot = rootDir.parent
def unsupportedLanguages = file("${projRoot}/src/unsupported_language_list.txt").readLines()
def localeTasks = []

fileTree("${projRoot}/po").include("**/*.po").grep {
	it.parentFile.name !in unsupportedLanguages
}.forEach { poFile ->
	def lang = poFile.parentFile.name
	def moPath = "${localeFolder}/${lang}/LC_MESSAGES/"

	def task = tasks.register("compileTranslation[${lang}]", Exec) {
		inputs.file(poFile)
		outputs.file("${moPath}/luanti.mo")
		doFirst { file(moPath).mkdirs() }
		commandLine("msgfmt", "-o", "${moPath}/luanti.mo", poFile)
	}
	localeTasks << task
}

tasks.register("compileTranslations") {
	dependsOn localeTasks
}

def assetsFolder = layout.buildDirectory.dir("assets").get().asFile
tasks.register("prepareAssets") {
	dependsOn tasks.named("compileTranslations")

	doFirst {
		logger.lifecycle('Preparing assets at {}', assetsFolder)
	}
	doLast {
		copy {
			from "${projRoot}/minetest.conf.example", "${projRoot}/README.md" into assetsFolder
		}
		// add：minetest.conf
		copy {
			from "${projRoot}/minetest.conf" into assetsFolder
		}
		copy {
			from "${projRoot}/doc/lgpl-2.1.txt" into assetsFolder
		}
		copy {
			from "${projRoot}/builtin" exclude "**/CMakeLists.txt" into "${assetsFolder}/builtin"
		}
		copy {
			from "${projRoot}/client/shaders" into "${assetsFolder}/client/shaders"
		}
		copy {
			from "${projRoot}/irr/media/Shaders" into "${assetsFolder}/client/shaders/Irrlicht"
		}
		copy {
			from "${projRoot}/fonts" include "*.ttf" into "${assetsFolder}/fonts"
		}
		copy {
			from "${projRoot}/textures/base/pack" into "${assetsFolder}/textures/base/pack"
		}
		// add：Unofficial-Faithful32x-Luanti 材质包
		copy {
			from "${projRoot}/textures/Unofficial-Faithful32x-Luanti" into "${assetsFolder}/textures/Unofficial-Faithful32x-Luanti"
		}
		// add：mineclonia 游戏
		copy {
			from "${projRoot}/games/mineclonia" into "${assetsFolder}/games/mineclonia"
		}
		copy {
			from "${localeFolder}" into "${assetsFolder}/locale"
		}

		file("${assetsFolder}/.nomedia").text = ""
	}
}

tasks.register("zipAssets", Zip) {
	dependsOn tasks.named("prepareAssets")

	archiveFileName = "assets.zip"
	from assetsFolder
	destinationDirectory = file("src/main/assets")
}

preBuild.dependsOn tasks.named("zipAssets")

clean {
	delete file("src/main/assets/assets.zip")
}

configurations.all {
    resolutionStrategy {
        force 'androidx.annotation:annotation-jvm:1.8.2'
        force 'androidx.annotation:annotation:1.8.2'
    }
}

dependencies {
	implementation project(':native')
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'org.apache.ftpserver:ftpserver-core:1.2.1'
	implementation 'org.apache.ftpserver:ftplet-api:1.2.1'
	implementation 'org.apache.mina:mina-core:2.2.5'
	implementation 'com.google.crypto.tink:tink-android:1.20.0'
}