apply plugin: 'com.android.library'
apply plugin: 'de.undercouch.download'

// 动态检测系统中的 ccache
def ccacheExec = "which ccache".execute().text.trim()
def cmakeArgsList = [
	"-DANDROID_STL=c++_shared",
	"-DENABLE_CURL=1",
	"-DENABLE_SOUND=1",
	"-DENABLE_GETTEXT=1",
	"-DBUILD_UNITTESTS=0",
	"-DENABLE_UPDATE_CHECKER=0"
]

// 如果找到了 ccache，给 CMake 加上编译器启动器参数
if (!ccacheExec.isEmpty()) {
	cmakeArgsList.add("-DCMAKE_C_COMPILER_LAUNCHER=${ccacheExec}")
	cmakeArgsList.add("-DCMAKE_CXX_COMPILER_LAUNCHER=${ccacheExec}")
}

android {
	ndkVersion "$ndk_version"
	defaultConfig {
		minSdkVersion 21
		compileSdk = 34
		targetSdkVersion 34
		externalNativeBuild {
			cmake {
				arguments cmakeArgsList
			}
		}
	}

	externalNativeBuild {
		cmake {
			path file("../../CMakeLists.txt")
		}
	}

	// supported architectures
	splits {
		abi {
			enable true
			reset()
			include 'arm64-v8a'
		}
	}

	buildTypes {
		release {
			ndk {
				debugSymbolLevel 'FULL'
			}
		}
	}
	namespace 'net.minetest'
}

def depsDir = layout.buildDirectory.dir("../deps").get().asFile
// 检查 arm64-v8a 目录或 depsDir 是否存在
if (new File(depsDir, 'arm64-v8a').exists() || depsDir.exists()) {
	tasks.register('getDeps') {
		doLast { logger.lifecycle('Using existing deps from {}', depsDir) }
	}
} else {
	// download and extract pre-compiled deps (libraries)
	def depsZip = layout.buildDirectory.file("deps.zip")
	tasks.register('downloadDeps', Download) {
		src 'https://github.com/luanti-org/luanti_android_deps/releases/download/latest/deps-lite.zip'
		dest depsZip
		overwrite false
	}

	tasks.register("getDeps", Copy) {
		dependsOn tasks.named("downloadDeps")

		from zipTree(depsZip)
		into depsDir
		doFirst {
			logger.lifecycle('Extracting to {}', depsDir)
			depsDir.mkdir()
		}
	}
}

preBuild.dependsOn tasks.named("getDeps")

clean {
	delete depsDir
}